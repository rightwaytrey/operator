# The operator viewer (noVNC) under a path of an existing nginx site.
#
# deploy/install-nginx.sh copies this to /etc/nginx/snippets/operator.conf
# and includes it from the server block of the site you name. Put it only
# behind a site that already authenticates every request (auth_basic, a
# cookie gate, client certificates, SSO): the viewer has no auth of its own,
# and anyone who reaches it can watch AND DRIVE every session. A whole-server
# auth rule covers these paths too, WebSocket handshakes included (the browser
# sends cookies and Authorization headers with the upgrade request), so a
# device unlocked once for the site can use the viewer from anywhere.
#
# proxy_pass with a trailing slash strips the prefix. The viewer's pages use
# relative URLs, and open.html derives noVNC's websockify path from its own
# location, so they work under a prefix unchanged.
#
# $connection_upgrade is nginx's standard WebSocket idiom; if the site does
# not define it yet, add to the http{} context (e.g. in conf.d/):
#     map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#
# Machine-specific extra locations (another host's viewer through an ssh
# tunnel, say) go in deploy/nginx-operator.local.conf, which is gitignored
# and appended by the installer.

# This machine's viewer: `op viewer start`, 127.0.0.1:6090 (OP_VIEWER_PORT).
location = /operator { return 301 /operator/; }
location /operator/ {
    proxy_pass http://127.0.0.1:6090/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}
